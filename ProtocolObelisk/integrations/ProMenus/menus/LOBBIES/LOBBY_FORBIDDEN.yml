#
# STATUS ATUAL:
#   %pinger_isonline_172.18.0.1:25871%
#
# Retornos confirmados da expansão Pinger:
#   &aOnline  -> ONLINE
#   &cOffline -> OFFLINE
#
# O estado &eReiniciando está preparado de forma segura, porém a
# expansão Pinger não produz esse terceiro retorno por conta própria.
# Até existir uma fonte real de reinício, ele permanecerá inativo.
#
# O Pinger define o estado visual e o feedback secundário. A autoridade
# de transferência permanece no Velocity; o [bungee] é enviado antes do
# assert para preservar o fluxo nativo do ProMenus 1.17.
#
# -------------------------------------------------------------------- #

