# Release artifacts contain several large immutable registry resources. A single Gradle worker
# keeps archive creation deterministic on constrained/container filesystems, and disabling the
# build cache prevents a previously interrupted archive from being restored as a task output.
protocolObeliskVersion=1.9.16-EVOLUTION
org.gradle.java.installations.auto-download=false
org.gradle.parallel=false
org.gradle.caching=false
org.gradle.workers.max=1
